name: Refresh public showcase
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public data only
        run: python scripts/refresh.py
      - name: Commit refreshed public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public project index and activity"
            git push
          fi
