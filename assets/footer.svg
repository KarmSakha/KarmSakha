<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="194" viewBox="0 0 1200 194" role="img" aria-labelledby="title"><title id="title">An idea is only the beginning. Explore karmx.dev.</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3c40" stroke-width=".45"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}.orbit{transform-origin:956px 250px;animation:orbit 32s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 8s linear infinite}@media(prefers-reduced-motion:reduce){.orbit,.flow{animation:none}}</style><rect width="1200" height="194" rx="12" fill="#101c21"/><text x="42" y="48" font-size="12" fill="#d3f492" font-family="monospace" >ALWAYS CONNECTING THE DOTS.</text><text x="42" y="107" font-size="44" fill="#edece1" font-family="Georgia,serif" >An idea is only the beginning.</text><text x="43" y="151" font-size="17" fill="#a6b7b6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Let’s make something people can use.</text><text x="953" y="148" font-size="17" fill="#d3f492" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >KARMX.DEV ↗</text></svg>