<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title"><title id="title">Yaman Khetan. Full-stack AI engineer and founder.</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3c40" stroke-width=".45"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}.orbit{transform-origin:956px 250px;animation:orbit 32s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 8s linear infinite}@media(prefers-reduced-motion:reduce){.orbit,.flow{animation:none}}</style><rect width="1200" height="510" rx="12" fill="#101c21"/><text x="44" y="46" font-size="22" fill="#d3f492" font-family="monospace" >K / X</text><text x="134" y="46" font-size="14" fill="#edece1" font-family="monospace" >YAMAN KHETAN / KARMSAKHA</text><text x="847" y="46" font-size="13" fill="#a6b7b6" font-family="monospace" >THE BUILDER’S ATLAS / 01</text><path d="M44 68L1156 68" fill="none" stroke="#2b3c40"/><text x="44" y="111" font-size="13" fill="#a6b7b6" font-family="monospace" >FULL-STACK AI ENGINEER  /  FOUNDER  /  BUILDER</text><text x="38" y="202" font-size="65" fill="#edece1" font-family="Georgia,serif" >From model weights</text><text x="38" y="279" font-size="72" fill="#d3f492" font-family="Georgia,serif" font-style="italic">to the last pixel.</text><text x="44" y="339" font-size="21" fill="#edece1" font-family="monospace" >Models, products, and the systems</text><text x="44" y="370" font-size="21" fill="#edece1" font-family="monospace" >that make them useful.</text><text x="44" y="470" font-size="12" fill="#d3f492" font-family="monospace" >EXPLORE THE WORK BELOW</text><path d="M298 466L683 466" fill="none" stroke="#2b3c40"/><path d="M674 460l9 6-9 6" fill="none" stroke="#d3f492"/><rect x="782" y="85" width="375" height="338" fill="url(#grid)"/><circle cx="956" cy="250" r="58" stroke="#2b3c40" fill="none" /><circle cx="956" cy="250" r="110" stroke="#2b3c40" fill="none" /><circle cx="956" cy="250" r="160" stroke="#2b3c40" fill="none" /><path d="M780 250L1133 250" fill="none" stroke="#2b3c40"/><path d="M956 79L956 421" fill="none" stroke="#2b3c40"/><g class="orbit"><circle cx="956" cy="90" r="5" stroke="#d3f492" fill="#d3f492" /><circle cx="1066" cy="250" r="4" stroke="#ed986d" fill="#ed986d" /><circle cx="956" cy="308" r="3" stroke="#d3f492" fill="#d3f492" /></g><text x="898" y="237" font-size="17" fill="#d3f492" font-family="monospace" >IDEA</text><text x="898" y="270" font-size="17" fill="#edece1" font-family="monospace" >→ SYSTEM</text><circle cx="956" cy="250" r="188" stroke="#2b3c40" fill="none" stroke-dasharray="2 10"/><text x="850" y="470" font-size="13" fill="#a6b7b6" font-family="monospace" >RESEARCH ↔ PRODUCT</text></svg>