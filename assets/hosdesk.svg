<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-labelledby="title"><title id="title">HOS Desk — routing and duty-log visualization</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3c40" stroke-width=".45"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}.orbit{transform-origin:956px 250px;animation:orbit 32s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 8s linear infinite}@media(prefers-reduced-motion:reduce){.orbit,.flow{animation:none}}</style><rect width="1200" height="332" rx="12" fill="#101c21"/><text x="42" y="43" font-size="13" fill="#d3f492" font-family="monospace" >03 / PRODUCT ENGINEERING</text><path d="M42 64L1158 64" fill="none" stroke="#2b3c40"/><text x="42" y="128" font-size="49" fill="#edece1" font-family="Georgia,serif" >HOS Desk</text><text x="42" y="186" font-size="38" fill="#edece1" font-family="Georgia,serif" font-style="italic">The route becomes the record.</text><text x="42" y="252" font-size="13" fill="#a6b7b6" font-family="monospace" >DJANGO  /  REACT  /  MAPLIBRE  /  SVG</text><text x="42" y="302" font-size="13" fill="#d3f492" font-family="monospace" >OPEN PROJECT  ↗</text><rect x="748" y="90" width="406" height="195" fill="url(#grid)"/><path d="M769 240L832 240 832 188 908 188 908 143 985 143 985 215 1070 215 1070 110 1137 110" stroke="#d3f492" fill="none" stroke-width="3"/><path class="flow" d="M769 254Q835 94 925 224T1137 126" stroke="#ed986d" fill="none" stroke-width="2"/><circle cx="769" cy="240" r="5" stroke="#101c21" fill="#d3f492" /><circle cx="908" cy="188" r="5" stroke="#101c21" fill="#d3f492" /><circle cx="1070" cy="215" r="5" stroke="#101c21" fill="#d3f492" /><circle cx="1137" cy="110" r="5" stroke="#101c21" fill="#d3f492" /><text x="755" y="307" font-size="12" fill="#a6b7b6" font-family="monospace" >ROUTE → SCHEDULE →