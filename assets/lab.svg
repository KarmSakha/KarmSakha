<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="title"><title id="title">Making bigger models practical on smaller machines</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3c40" stroke-width=".45"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}.orbit{transform-origin:956px 250px;animation:orbit 32s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 8s linear infinite}@media(prefers-reduced-motion:reduce){.orbit,.flow{animation:none}}</style><rect width="1200" height="245" rx="12" fill="#101c21"/><text x="42" y="43" font-size="13" fill="#ed986d" font-family="monospace" >RESEARCH / DEPLOYMENT</text><text x="42" y="101" font-size="43" fill="#edece1" font-family="Georgia,serif" >Bigger models.</text><text x="42" y="154" font-size="43" fill="#d3f492" font-family="Georgia,serif" font-style="italic">Smaller machines.</text><rect x="738" y="120" width="55" height="45" rx="3" fill="#d3f492"/><text x="750" y="190" font-size="13" fill="#a6b7b6" font-family="monospace" >Q2</text><rect x="830" y="92" width="55" height="73" rx="3" fill="#99b786"/><text x="842" y="190" font-size="13" fill="#a6b7b6" font-family="monospace" >Q3</text><rect x="922" y="63" width="55" height="102" rx="3" fill="#6f9280"/><text x="934" y="190" font-size="13" fill="#a6b7b6" font-family="monospace" >Q5</text><rect x="1014" y="40" width="55" height="125" rx="3" fill="#ed986d"/><text x="1026" y="190" font-size="13" fill="#a6b7b6" font-family="monospace" >Q6</text><text x="42" y="213" font-size="12" fill="#a6b7b6" font-family="monospace" >CALIBRATE → QUANTIZE → MEASURE → SHARE</text></svg>