<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="224" viewBox="0 0 1200 224" role="img" aria-labelledby="title"><title id="title">Private work, summarized by capability without identifying projects</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3c40" stroke-width=".45"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}.orbit{transform-origin:956px 250px;animation:orbit 32s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 8s linear infinite}@media(prefers-reduced-motion:reduce){.orbit,.flow{animation:none}}</style><rect width="1200" height="224" rx="12" fill="#101c21"/><text x="42" y="43" font-size="13" fill="#d3f492" font-family="monospace" >THE OTHER SIDE OF THE WORK</text><text x="42" y="99" font-size="44" fill="#edece1" font-family="Georgia,serif" >Private code. Public craft.</text><circle cx="47" cy="141" r="3" stroke="#d3f492" fill="#d3f492" /><text x="62" y="145" font-size="13" fill="#a6b7b6" font-family="monospace" >NATIVE APPS</text><circle cx="431" cy="141" r="3" stroke="#d3f492" fill="#d3f492" /><text x="446" y="145" font-size="13" fill="#a6b7b6" font-family="monospace" >EDUCATION</text><circle cx="815" cy="141" r="3" stroke="#d3f492" fill="#d3f492" /><text x="830" y="145" font-size="13" fill="#a6b7b6" font-family="monospace" >DATA SYSTEMS</text><circle cx="47" cy="184" r="3" stroke="#d3f492" fill="#d3f492" /><text x="62" y="188" font-size="13" fill="#a6b7b6" font-family="monospace" >FINANCIAL TOOLS</text><circle cx="431" cy="184" r="3" stroke="#d3f492" fill="#d3f492" /><text x="446" y="188" font-size="13" fill="#a6b7b6" font-family="monospace" >COMMUNICATION</text><circle cx="815" cy="184" r="3" stroke="#d3f492" fill="#d3f492" /><text x="830" y="188" font-size="13" fill="#a6b7b6" font-family="monospace" >WEB EXPERIENCES</text></svg>