<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-labelledby="title"><title id="title">TinyQuery — trained from scratch, multilingual structured actions</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3c40" stroke-width=".45"/></pattern></defs><style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}.orbit{transform-origin:956px 250px;animation:orbit 32s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 8s linear infinite}@media(prefers-reduced-motion:reduce){.orbit,.flow{animation:none}}</style><rect width="1200" height="332" rx="12" fill="#101c21"/><text x="42" y="43" font-size="13" fill="#ed986d" font-family="monospace" >02 / MODEL ENGINEERING</text><path d="M42 64L1158 64" fill="none" stroke="#2b3c40"/><text x="42" y="128" font-size="49" fill="#edece1" font-family="Georgia,serif" >TinyQuery</text><text x="42" y="186" font-size="38" fill="#edece1" font-family="Georgia,serif" font-style="italic">Small model. Three ways to ask.</text><text x="42" y="252" font-size="13" fill="#a6b7b6" font-family="monospace" >PYTORCH  /  SQL  /  ENGLISH · HINDI · HINGLISH</text><text x="42" y="302" font-size="13" fill="#ed986d" font-family="monospace" >OPEN PROJECT  ↗</text><text x="753" y="114" font-size="14" fill="#a6b7b6" font-family="monospace" >English</text><path d="M841 107L883 163" fill="none" stroke="#ed986d"/><text x="753" y="158" font-size="14" fill="#a6b7b6" font-family="monospace" >Hindi</text><path d="M841 151L883 163" fill="none" stroke="#ed986d"/><text x="753" y="202" font-size="14" fill="#a6b7b6" font-family="monospace" >Hinglish</text><path d="M841 195L883 163" fill="none" stroke="#ed986d"/><rect x="883" y="123" width="141" height="82" rx="8" fill="#302b28" stroke="#ed986d"/><text x="896" y="161" font-size="26" fill="#ed986d" font-family="monospace" >139.7M</text><text x="896" y="185"